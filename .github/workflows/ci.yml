name: Next centralized CI
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
    - unlabeled
  push:
    branches:
    - main
    tags:
    - v*
  workflow_dispatch:
    inputs:
      qqq_ref:
        description: QQQ source ref for acceptance
        type: string
        required: false
permissions:
  contents: read
jobs:
  ci:
    if: (github.event_name == 'pull_request' && !contains(fromJSON('["labeled","unlabeled"]'),
      github.event.action)) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: QRun-IO/qqq-orb/.github/workflows/next-ci.yml@0f33ddadf88b9a1b940b8883782fe2000ee1d2bd
  acceptance:
    if: github.event_name != 'pull_request' || !contains(fromJSON('["labeled","unlabeled"]'),
      github.event.action) || github.event.label.name == 'full-acceptance'
    uses: QRun-IO/qqq-orb/.github/workflows/next-acceptance.yml@0f33ddadf88b9a1b940b8883782fe2000ee1d2bd
    with:
      qqq_ref: ${{ inputs.qqq_ref || '' }}
  dashboard-image:
    if: (github.event_name == 'pull_request' && !contains(fromJSON('["labeled","unlabeled"]'),
      github.event.action)) || (github.event_name == 'push' && startsWith(github.ref,
      'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    uses: QRun-IO/qqq-orb/.github/workflows/next-dashboard-image.yml@0f33ddadf88b9a1b940b8883782fe2000ee1d2bd
