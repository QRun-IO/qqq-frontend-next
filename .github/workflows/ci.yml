name: CI

# Fast PR checks (QRun-IO/qqq#709). The real-backend gate runs in acceptance.yml.
# Each job installs on its own so they run in parallel; none needs a backend.

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  unit:
    name: Typecheck, lint, unit tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests with src/lib coverage thresholds (vitest.config.ts)
        run: pnpm test:coverage

  e2e:
    name: Mocked e2e (Playwright, chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Production build
        run: pnpm build
      - name: Mocked e2e suite
        env:
          QQQ_E2E_SERVER: production
        run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  storybook:
    name: Storybook build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - run: pnpm build-storybook --quiet
