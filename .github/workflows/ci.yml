name: Next centralized CI
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
    - unlabeled
  push:
    branches:
    - main
    tags:
    - v*
  workflow_dispatch:
    inputs:
      qqq_ref:
        description: QQQ source ref for acceptance
        type: string
        required: false
permissions:
  contents: read
jobs:
  ci:
    if: (github.event_name == 'pull_request' && !contains(fromJSON('["labeled","unlabeled"]'),
      github.event.action)) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: QRun-IO/qqq-orb/.github/workflows/next-ci.yml@a5477b95cdc7b9d5a37118d3f625826ddf20e252
  acceptance:
    if: github.event_name != 'pull_request' || !contains(fromJSON('["labeled","unlabeled"]'),
      github.event.action) || github.event.label.name == 'full-acceptance'
    uses: QRun-IO/qqq-orb/.github/workflows/next-acceptance.yml@a5477b95cdc7b9d5a37118d3f625826ddf20e252
    with:
      # Keep PR, main and tag acceptance on the core paired with this lease protocol.
      qqq_ref: ${{ inputs.qqq_ref || '33464d37e815e61dc0a08bd5b2eb249718dfe1b5' }}
  dashboard-image:
    if: (github.event_name == 'pull_request' && !contains(fromJSON('["labeled","unlabeled"]'),
      github.event.action)) || (github.event_name == 'push' && startsWith(github.ref,
      'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    uses: QRun-IO/qqq-orb/.github/workflows/next-dashboard-image.yml@a5477b95cdc7b9d5a37118d3f625826ddf20e252
